<section class="page">
  <h1>Student Enrollment Form</h1>
  <p class="sub">Assign students to classes.</p>

  <mat-card>
    <mat-card-content>
      <form class="form-grid" [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline">
          <mat-label>Class</mat-label>
          <mat-select formControlName="classId">
            <mat-option *ngFor="let c of classes" [value]="c.id">{{ c.name }} ({{ c.subject }})</mat-option>
          </mat-select>
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Student</mat-label>
          <mat-select formControlName="studentId">
            <mat-option *ngFor="let s of students" [value]="s.id">{{ s.fullName }}</mat-option>
          </mat-select>
        </mat-form-field>
        <button mat-flat-button color="primary" type="submit">Enroll Student</button>
      </form>
      <p class="ok" *ngIf="message">{{ message }}</p>
      <p class="err" *ngIf="error">{{ error }}</p>
    </mat-card-content>
  </mat-card>

  <mat-card class="table-card">
    <mat-card-content>
      <table mat-table [dataSource]="enrollments" class="full">
        <ng-container matColumnDef="className">
          <th mat-header-cell *matHeaderCellDef>Class</th>
          <td mat-cell *matCellDef="let e">{{ e.className }}</td>
        </ng-container>
        <ng-container matColumnDef="studentName">
          <th mat-header-cell *matHeaderCellDef>Student</th>
          <td mat-cell *matCellDef="let e">{{ e.studentName }}</td>
        </ng-container>
        <ng-container matColumnDef="enrolledAt">
          <th mat-header-cell *matHeaderCellDef>Enrolled</th>
          <td mat-cell *matCellDef="let e">{{ e.enrolledAt | date: 'mediumDate' }}</td>
        </ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let e">
            <button mat-icon-button color="warn" (click)="remove(e.id)"><mat-icon>delete</mat-icon></button>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="columns"></tr>
        <tr mat-row *matRowDef="let row; columns: columns"></tr>
      </table>
    </mat-card-content>
  </mat-card>
</section>
